<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>High Low - Lucky Play</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .top {
            background: #1e293b;
            padding: 20px;
        }

        .game {
            margin: 25px auto;
            padding: 30px 15px;
            background: #1e293b;
            border-radius: 15px;
            max-width: 500px;
        }

        #card {
            width: 150px;
            height: 190px;
            margin: 30px auto;
            background: white;
            color: #0f172a;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: bold;
        }

        #result {
            min-height: 30px;
            color: #cbd5e1;
            font-size: 19px;
            margin: 20px 0;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px auto;
            max-width: 350px;
        }

        .choice {
            flex: 1;
            padding: 15px 10px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .high {
            background: #22c55e;
        }

        .low {
            background: #3b82f6;
        }

        .choice:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .new-game {
            width: 100%;
            max-width: 300px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #8b5cf6;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #60a5fa;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="top">

    <h1>🎮 Lucky Play</h1>

    <p>
        High / Low
    </p>

</div>



<div class="game">

    <h2>🃏 High / Low</h2>

    <p>
        Current card ke baad next card High hoga ya Low?
    </p>


    <div id="card">
        ?
    </div>


    <div id="result">
        High ya Low choose karo.
    </div>


    <div class="buttons">

        <button
            class="choice high"
            id="highButton"
            onclick="makeGuess('High')"
        >
            ⬆️ High
        </button>


        <button
            class="choice low"
            id="lowButton"
            onclick="makeGuess('Low')"
        >
            ⬇️ Low
        </button>

    </div>


    <button
        class="new-game"
        onclick="newGame()"
    >

        🔄 New Round

    </button>


    <br>


    <a href="../index.html">

        ← Back to Home

    </a>

</div>



<script>

    let currentCard;

    let roundOver = false;


    function randomCard() {

        return Math.floor(Math.random() * 13) + 1;

    }


    function showCard(number) {

        const card =
            document.getElementById("card");


        let symbol = "";


        if (number === 1) {
            symbol = "A";
        }
        else if (number === 11) {
            symbol = "J";
        }
        else if (number === 12) {
            symbol = "Q";
        }
        else if (number === 13) {
            symbol = "K";
        }
        else {
            symbol = number;
        }


        card.textContent = symbol;

    }


    function newGame() {

        currentCard = randomCard();

        roundOver = false;


        document.getElementById("card").textContent =
            "❓";


        document.getElementById("result").textContent =
            "High ya Low choose karo.";


        document.getElementById("highButton").disabled =
            false;


        document.getElementById("lowButton").disabled =
            false;

    }


    function makeGuess(choice) {

        if (roundOver) {
            return;
        }


        const nextCard =
            randomCard();


        showCard(nextCard);


        let actualResult;


        if (nextCard > currentCard) {

            actualResult = "High";

        }
        else if (nextCard < currentCard) {

            actualResult = "Low";

        }
        else {

            actualResult = "Same";

        }


        if (actualResult === "Same") {

            document.getElementById("result").textContent =
                "🤝 Same card! Current aur next card same tha.";

        }
        else if (choice === actualResult) {

            document.getElementById("result").textContent =
                "🎉 Sahi guess! Next card " +
                actualResult +
                " tha.";

        }
        else {

            document.getElementById("result").textContent =
                "🙂 Is baar match nahi hua. Next card " +
                actualResult +
                " tha.";

        }


        roundOver = true;


        document.getElementById("highButton").disabled =
            true;


        document.getElementById("lowButton").disabled =
            true;

    }


    newGame();

</script>


</body>

</html>
