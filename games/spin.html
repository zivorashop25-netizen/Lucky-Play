<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spin Wheel - Lucky Play</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .top {
            background: #1e293b;
            padding: 20px;
        }

        .game {
            margin: 25px auto;
            padding: 25px 15px;
            background: #1e293b;
            border-radius: 15px;
            max-width: 500px;
        }

        #wheel {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            margin: 30px auto;
            background: conic-gradient(
                #22c55e 0deg 60deg,
                #3b82f6 60deg 120deg,
                #eab308 120deg 180deg,
                #ef4444 180deg 240deg,
                #a855f7 240deg 300deg,
                #f97316 300deg 360deg
            );

            border: 8px solid #334155;

            transition: transform 3s ease-out;

            position: relative;
        }

        #pointer {
            font-size: 35px;
            margin-bottom: -25px;
            position: relative;
            z-index: 2;
        }

        #result {
            font-size: 20px;
            margin: 20px 0;
            color: #cbd5e1;
        }

        button {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #475569;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #60a5fa;
            text-decoration: none;
        }

    </style>

</head>

<body>


    <div class="top">

        <h1>🎮 Lucky Play</h1>

        <p>
            Spin Wheel
        </p>

    </div>



    <div class="game">

        <div id="pointer">
            🔻
        </div>


        <div id="wheel"></div>


        <div id="result">
            Spin dabao!
        </div>


        <button id="spinButton" onclick="spinWheel()">

            🎡 Spin

        </button>


        <br>


        <a href="../index.html">

            ← Back to Home

        </a>

    </div>



    <script>

        let rotation = 0;

        let spinning = false;


        function spinWheel() {

            if (spinning) {
                return;
            }


            spinning = true;


            document.getElementById("spinButton").disabled = true;


            const extraRotation =
                1440 + Math.floor(Math.random() * 720);


            rotation += extraRotation;


            document.getElementById("wheel").style.transform =
                "rotate(" + rotation + "deg)";


            setTimeout(function() {

                const points =
                    Math.floor(Math.random() * 90) + 10;


                document.getElementById("result").textContent =
                    "🎉 Aapko " + points + " virtual points mile!";


                document.getElementById("spinButton").disabled = false;


                spinning = false;

            }, 3000);

        }

    </script>


</body>

</html>
