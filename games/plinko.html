<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plinko - Lucky Play</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .top {
            background: #1e293b;
            padding: 20px;
        }

        .game {
            margin: 25px auto;
            padding: 25px 15px;
            background: #1e293b;
            border-radius: 15px;
            max-width: 500px;
        }

        #board {
            position: relative;
            width: 300px;
            height: 380px;
            margin: 20px auto;
            background: #0b1220;
            border-radius: 15px;
            overflow: hidden;
        }

        .peg {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #94a3b8;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        #ball {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #facc15;
            border-radius: 50%;
            left: 140px;
            top: 10px;
            display: none;
            z-index: 5;
        }

        .slots {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        .slot {
            padding: 10px 2px;
            background: #334155;
            border-radius: 6px;
            font-size: 12px;
        }

        button {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #475569;
        }

        #result {
            margin: 20px 0;
            color: #cbd5e1;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #60a5fa;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="top">

    <h1>🎮 Lucky Play</h1>

    <p>
        Plinko Demo
    </p>

</div>



<div class="game">

    <h2>🔵 Plinko</h2>

    <p id="result">
        Ball drop karne ke liye button dabao.
    </p>


    <div id="board">

        <div id="ball"></div>

    </div>


    <div class="slots">

        <div class="slot">10</div>

        <div class="slot">20</div>

        <div class="slot">50</div>

        <div class="slot">20</div>

        <div class="slot">10</div>

    </div>


    <br>


    <button
        id="dropButton"
        onclick="dropBall()"
    >

        🔵 Drop Ball

    </button>


    <br>


    <a href="../index.html">

        ← Back to Home

    </a>

</div>



<script>

    const board =
        document.getElementById("board");

    const ball =
        document.getElementById("ball");

    const result =
        document.getElementById("result");

    const dropButton =
        document.getElementById("dropButton");


    function createPegs() {

        const rows = 7;

        const cols = 7;


        for (let row = 0; row < rows; row++) {

            for (let col = 0; col < cols; col++) {

                const peg =
                    document.createElement("div");

                peg.className = "peg";


                const offset =
                    row % 2 === 0 ? 0 : 20;


                peg.style.left =
                    (35 + col * 38 + offset) + "px";


                peg.style.top =
                    (45 + row * 42) + "px";


                board.appendChild(peg);

            }

        }

    }


    function dropBall() {

        dropButton.disabled = true;

        ball.style.display = "block";

        ball.style.left = "140px";

        ball.style.top = "5px";


        let step = 0;


        const timer =
            setInterval(function() {

                step++;


                let currentLeft =
                    parseFloat(ball.style.left);


                let currentTop =
                    parseFloat(ball.style.top);


                currentTop += 15;


                const direction =
                    Math.random() > 0.5 ? 8 : -8;


                currentLeft += direction;


                if (currentLeft < 10) {
                    currentLeft = 10;
                }


                if (currentLeft > 270) {
                    currentLeft = 270;
                }


                ball.style.left =
                    currentLeft + "px";


                ball.style.top =
                    currentTop + "px";


                if (step >= 23) {

                    clearInterval(timer);


                    const points =
                        Math.floor(
                            Math.random() * 41
                        ) + 10;


                    result.textContent =
                        "🎉 Aapko " +
                        points +
                        " virtual points mile!";


                    dropButton.disabled = false;

                }

            }, 100);

    }


    createPegs();

</script>


</body>

</html>
